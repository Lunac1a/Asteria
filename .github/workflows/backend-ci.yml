name: Backend CI

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-checks:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint
        run: ruff check .

      - name: Reject tracked private configuration
        run: python scripts/check_release_files.py

      - name: Run isolated API regression tests
        run: python scripts/ci_tests.py all

  postgres-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: recovery_protocol
          PGDATA: /tmp/asteria-ci/pgdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recovery_protocol"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ASTERIA_RECOVERY_TEST_URL: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/recovery_protocol
      ASTERIA_RECOVERY_TEST_PGDATA: /tmp/asteria-ci/pgdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Real PostgreSQL recovery and schema contracts
        run: python scripts/ci_tests.py postgres
